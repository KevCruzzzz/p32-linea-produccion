<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Línea de producción · Tijuana</title>
<style>
:root{--bg:#0e1419;--card:#17202a;--bd:#263544;--tx:#e6edf3;--mut:#8b9bab;--ok:#2ecc71;--esp:#4aa3ff;--blq:#f5a623;--fal:#ff4d4f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1}.dot{width:10px;height:10px;border-radius:50%;background:var(--fal);display:inline-block}.dot.on{background:var(--ok)}
main{padding:14px;max-width:1300px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}.k b{display:block;font-size:22px}.k span{color:var(--mut);font-size:12px}
.linea{display:flex;align-items:stretch;overflow-x:auto;gap:0;padding:6px 0 12px}
.est{min-width:128px;flex:1;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer}
.est.sel{outline:2px solid #fff}.est h3{margin:0 0 4px;font-size:14px}.est small{color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#06121c;font-weight:600}
.procesando{background:var(--ok)}.esperando{background:var(--esp)}.bloqueada{background:var(--blq)}.falla{background:var(--fal);color:#fff}
.est.rcuello{border-color:var(--blq);box-shadow:0 0 12px #f5a62366}.est.rparo{border-color:var(--fal)}
.bar{height:6px;background:#0b1117;border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.buf{width:46px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;color:var(--mut);font-size:11px}
.buf div{display:flex;flex-direction:column-reverse;gap:2px}.buf u{width:18px;height:8px;border:1px solid var(--bd);background:#0b1117}.buf u.f{background:var(--blq);border-color:var(--blq)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}.panel h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
button,select{background:#22303d;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:3px;font:inherit;cursor:pointer}
button.p{background:#1d6fd6;border-color:#1d6fd6}button.r{background:#7a1f22;border-color:var(--fal)}
#log{max-height:300px;overflow:auto;font:12px ui-monospace,monospace}#log div{padding:3px 0;border-bottom:1px solid #1f2b37}
.t{color:var(--mut)}.ev-paro_iniciado,.ev-caos_matar_estacion,.ev-caos_matar_buffer{color:var(--fal)}.ev-estacion_reanudada{color:var(--ok)}.ev-cambio_de_ciclo{color:var(--blq)}
td{padding:2px 10px 2px 0}
</style></head><body>
<header><h1>🏭 Línea de producción · Tijuana</h1><span id="reloj" class="t">—</span><span class="dot" id="dot"></span><span id="live" class="t">conectando…</span></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="linea" id="linea"></div>
<div class="grid">
 <div>
  <div class="panel"><h2>Simulación</h2>
   Velocidad <select id="vel"><option value="50">×50 (9 min)</option><option value="200" selected>×200 (2.3 min)</option><option value="1000">×1000 (27 s)</option></select>
   <button class="p" onclick="post('/api/simulacion/turno?velocidad='+vel.value)">▶ Turno 7.5 h (900 u)</button>
   <br><button onclick="post('/api/estaciones/4/paro?segundos=180&causa=falla_maquina')">Paro 3 min E4</button>
   <button onclick="post('/api/estaciones/4/paro?segundos=900&causa=falla_maquina')">Paro 15 min E4</button>
   <button onclick="post('/api/estaciones/1/paro?segundos=300&causa=falta_material')">Falta material E1</button>
   <button onclick="post('/api/estaciones/6/ciclo?factor=1.2')">Cambio de modelo +20 % E6</button>
   <button onclick="post('/api/estaciones/2/ciclo?factor=1.6')">E2 se vuelve lenta ×1.6</button>
   <button onclick="[1,2,3,4,5,6,7,8].forEach(i=>post('/api/estaciones/'+i+'/ciclo?factor=1.0'))">Restablecer ciclos</button>
  </div>
  <div class="panel"><h2>Pruebas de caos</h2>
   Estación <select id="cn"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
   <button class="r" onclick="post('/api/caos/matar_estacion/'+cn.value)">💥 Matar proceso de estación</button>
   <button class="r" onclick="post('/api/caos/matar_buffer/'+Math.min(7,cn.value))">💥 Matar buffer</button>
   <button onclick="post('/api/estaciones/'+cn.value+'/reparar')">🔧 Reparar</button>
   <div id="msg" class="t" style="margin-top:6px"></div>
  </div>
  <div class="panel"><h2>Detalle de estación</h2><div id="det" class="t">Haz clic en una estación.</div></div>
 </div>
 <div class="panel"><h2>Bitácora de eventos</h2><div id="log"></div></div>
</div>
</main>
<script>
let sel=4,E=null;const $=id=>document.getElementById(id);
const f=(x,d=0)=>(x==null?0:x).toFixed(d), hm=s=>{s=Math.round(s);return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'};
async function post(u){try{const r=await fetch(u,{method:'POST'});const j=await r.json();$('msg').textContent='OK '+JSON.stringify(j)}catch(e){$('msg').textContent='Error '+e}}
function pintar(d){E=d;if(!d.estaciones)return;
 $('reloj').textContent='t sim '+hm(d.t_sim)+(d.terminado?' · turno terminado':'')+' · ×'+d.vel;
 const c=d.estaciones.find(e=>e.id==d.cuello);
 const K=[[d.salidas+' / '+d.demanda,'piezas terminadas'],[f(d.th_hora_ventana),'pzas/h (últ. 10 min) · meta '+f(d.th_objetivo_hora)],
 [f(d.capacidad_hora,1),'capacidad real/h (cuello '+(c?f(c.ciclo_s,0)+' s':'—')+')'],[d.wip,'WIP (piezas en proceso)'],
 [f(d.ciclo_little_s),'ciclo s · Little = WIP/salida'],[d.razon_cuello=='ninguno'?'—':'E'+d.cuello,'cuello ('+d.razon_cuello+')'],[hm(d.paro_total_s),'paro acumulado']];
 $('kpis').innerHTML=K.map(k=>'<div class="k"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>').join('');
 let h='';d.estaciones.forEach((e,i)=>{
  h+='<div class="est '+(e.id==sel?'sel ':'')+(e.rol=='cuello'?'rcuello ':'')+(e.rol=='paro'?'rparo':'')+'" onclick="sel='+e.id+';pintar(E)"><h3>E'+e.id+' <small>'+f(e.ciclo_s)+' s</small></h3>'+
  '<span class="badge '+e.estado+'">'+e.estado+'</span><div class="bar"><i style="width:'+f(e.util*100)+'%"></i></div><small>util '+f(e.util*100)+'% · '+(e.rol=='normal'?'ok':e.rol)+'<br>hechas '+e.hechas+'</small></div>';
  const b=d.buffers[i];if(b){let u='';for(let k=0;k<b.cap;k++)u+='<u class="'+(k<b.nivel?'f':'')+'"></u>';h+='<div class="buf"><div>'+u+'</div>'+b.nivel+'/'+b.cap+'</div>'}});
 $('linea').innerHTML=h;
 const e=d.estaciones.find(x=>x.id==sel);if(e)$('det').innerHTML='<b style="color:var(--tx)">Estación '+e.id+'</b> · <span class="badge '+e.estado+'">'+e.estado+'</span><table><tr><td>Ciclo base × factor</td><td>'+f(e.ciclo_s,1)+' s</td></tr><tr><td>Pieza en manos</td><td>'+(e.pieza==null?'—':'#'+e.pieza)+'</td></tr>'+
  '<tr><td>% procesando</td><td>'+f(e.util*100)+'</td></tr><tr><td>% esperando (inanición)</td><td>'+f(e.pct_esp*100)+'</td></tr><tr><td>% bloqueada</td><td>'+f(e.pct_bloq*100)+'</td></tr><tr><td>% en falla</td><td>'+f(e.pct_falla*100)+'</td></tr>'+
  '<tr><td>Piezas hechas</td><td>'+e.hechas+'</td></tr><tr><td>Reinicios del proceso</td><td>'+e.reinicios+'</td></tr>'+(e.estado=='falla'?'<tr><td>Falla restante</td><td>'+f(e.falla_restante)+' s ('+e.causa+')</td></tr>':'')+'</table>';
}
function conectar(){const s=new EventSource('/api/stream');
 s.addEventListener('linea',m=>{$('dot').className='dot on';$('live').textContent='en vivo';pintar(JSON.parse(m.data))});
 s.onerror=()=>{$('dot').className='dot';$('live').textContent='reconectando…'}}
async function bit(){try{const r=await (await fetch('/api/bitacora')).json();
 $('log').innerHTML=r.map(e=>'<div class="ev-'+e.tipo+'"><span class="t">#'+e.n+' · '+hm(e.t_sim)+'</span> '+e.tipo+' '+JSON.stringify(e.datos)+'</div>').join('')}catch(e){}}
conectar();bit();setInterval(bit,1500);
</script></body></html>
